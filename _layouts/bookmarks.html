---
layout: page
---

<style>
  .bookmark-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1.25rem;
    margin-top: 1.5rem;
  }

  .bookmark-card {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border-color, rgba(0,0,0,0.12));
    border-radius: 0.75rem;
    overflow: hidden;
    text-decoration: none !important;
    color: inherit !important;
    background: var(--card-bg, var(--main-bg));
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }

  .bookmark-card:hover {
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
    transform: translateY(-3px);
  }

  .bookmark-card__cover {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
    border-bottom: 1px solid var(--border-color, rgba(0,0,0,0.08));
  }

  .bookmark-card__body {
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    flex: 1;
  }

  .bookmark-card__meta {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .bookmark-card__favicon {
    width: 16px;
    height: 16px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .bookmark-card__domain {
    font-size: 0.72rem;
    color: var(--text-muted-color);
    text-transform: lowercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .bookmark-card__title {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--heading-color, var(--text-color));
    line-height: 1.4;
    margin-top: 0.2rem;
  }

  .bookmark-card__description {
    font-size: 0.82rem;
    color: var(--text-muted-color);
    line-height: 1.55;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .bookmark-card__date {
    font-size: 0.72rem;
    color: var(--text-muted-color);
    margin-top: auto;
    padding-top: 0.5rem;
  }

  @media (max-width: 576px) {
    .bookmark-grid {
      grid-template-columns: 1fr;
    }
  }
</style>

{{ content }}

{% assign bookmarks = site.data.bookmarks %}
{% if bookmarks.size > 0 %}
  <div class="bookmark-grid">
    {% for bookmark in bookmarks %}
      {% include bookmark-card.html bookmark=bookmark %}
    {% endfor %}
  </div>
{% else %}
  <p class="text-muted">Henüz yer imi eklenmemiş.</p>
{% endif %}
