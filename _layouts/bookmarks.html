---
layout: page
---

{% include bookmarks-styles.html %}

{{ content }}

{% assign bookmarks = site.data.bookmarks %}
{% if bookmarks.size > 0 %}
  <div class="bookmark-grid">
    {% for bookmark in bookmarks %}
      {% include bookmark-card.html bookmark=bookmark %}
    {% endfor %}
  </div>
{% else %}
  <p class="text-muted">Henüz yer imi eklenmemiş.</p>
{% endif %}
