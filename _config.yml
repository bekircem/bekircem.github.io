theme: jekyll-theme-chirpy

lang: tr
timezone: Europe/Istanbul

title: bekircem
tagline: Geliştirme deneyimlerimle ilgili notlarım
description: >-
  Geliştirme deneyimlerimle ilgili notlarım.

url: "https://bekircem.github.io"

github:
  username: bekircem

twitter:
  username: bekircem

social:
  name: Bekir Cem Ünalan
  email: bekircem@duck.com
  links:
    - https://twitter.com/bekircem
    - https://github.com/bekircem

webmaster_verifications:
  google:
  bing:

analytics:
  google:
    id:

pageviews:
  provider:

theme_mode:

cdn:

avatar: "https://avatars.githubusercontent.com/u/2201820?v=4"

social_preview_image:

toc: true

comments:
  provider: disqus
  disqus:
    shortname: bekircem

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

baseurl: ""

# ------------ The following options are not recommended to be modified ------------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - "package*.json"
  - Gemfile
  - Gemfile.lock

plugins:
  - jekyll-redirect-from

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
